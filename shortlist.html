
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevScope - Shortlist</title>
    <script type="module" src="shortlist.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>

<body class="min-h-screen bg-[#0B1220] bg-[radial-gradient(#1B2742_1px,transparent_1px)] bg-[length:24px_24px] text-[#E6EDF7] font-['Inter']">

    <header>
    <nav class="flex items-center justify-between flex-wrap gap-2 px-8 py-2 min-h-16 border-b border-[#1F2A44] bg-[#0B1220]">

        <div class="font-semibold text-lg font-mono">
            <span class="text-[#2DD4BF]">&lt;/&gt;</span> DevScope
        </div>

        <div class="flex items-center gap-2 flex-wrap">

            <a href="index.html"
               class="px-4 py-3 rounded-lg text-[#9FB0CA] text-[15px] hover:bg-[#13213B]">
                Recherche
            </a>

            <a href="shortlist.html"
               class="px-4 py-3 rounded-lg bg-[#13213B] text-[#2DD4BF] font-semibold text-[15px]">
                Shortlist
            </a>

            <span class="text-xs bg-[#13213B] text-[#9FB0CA] px-2.5 py-1.5 rounded-md border border-[#1F2A44] font-mono">
                rate_limit: 58
            </span>

        </div>
    </nav>
    </header>


   
    <main class="max-w-[1040px] mx-auto px-6 py-8">
        <h1 class="text-[32px] mb-6 font-bold">
            Shortlist
            <span class="font-mono text-[#2DD4BF] text-xl">
                [3 candidats]
            </span>
        </h1>
        <div class="flex gap-4 flex-wrap mb-6">
            <div class="flex-1 min-w-[220px]">
                <label for="q" class="block text-sm font-semibold mb-1.5">
                    Rechercher par nom ou login
                </label>

                <input type="text" id="nom" class="w-full border border-[#33456B] rounded-lg px-3.5 py-3 text-[15px] bg-[#0B1220] text-[#E6EDF7] min-h-11 font-mono outline-none focus:border-[#2DD4BF]">
            </div>
            <div>
                <label for="info" class="block text-sm font-semibold mb-1.5">
                    Trier par
                </label>
                <select id="info" class="border border-[#33456B] rounded-lg px-3.5 py-3 text-[15px] bg-[#0B1220] text-[#E6EDF7] min-h-11 outline-none">
                    <option>Nom (A–Z)</option>
                    <option>Date d'ajout</option>
                </select>

            </div>

        </div>

          <div class="list-cand grid grid-cols-1 md:grid-cols-2 gap-4 relative"></div>
    </main>
 <div id="modal-statut" class=" fixed inset-0 z-[100] items-center justify-center bg-black/60 p-4" hidden>

   <form id="modifier" class=" w-full max-w-sm  rounded-xl border border-[#33456B] bg-[#0B1220] p-6 shadow-2xl">

    <div class="cont flex flex-col gap-1.5 mb-3">
      <label class=" cursor-pointer">
        <input type="radio" name="statut" value="refusé" class="peer sr-only" checked>
        <span class="block text-center px-4 py-1.5 rounded-lg border border-[#33456B] text-[#9FB0CA] text-sm font-semibold transition-colors hover:bg-red-400/5 peer-checked:text-red-400 peer-checked:border-red-400 peer-checked:bg-red-400/10 peer-focus-visible:ring-2 peer-focus-visible:ring-red-400/50">refuser</span>
      </label>

      <label class=" cursor-pointer">
        <input type="radio" name="statut" value="à contacter" class="peer sr-only">
        <span class="block text-center px-4 py-1.5 rounded-lg border border-[#33456B] text-[#9FB0CA] text-sm font-semibold transition-colors hover:bg-amber-400/5 peer-checked:text-amber-400 peer-checked:border-amber-400 peer-checked:bg-amber-400/10 peer-focus-visible:ring-2 peer-focus-visible:ring-amber-400/50">à contacter</span>
      </label>
      <label class=" cursor-pointer">
        <input type="radio" name="statut" value="Retenu" class="peer sr-only">
        <span class="block text-center px-4 py-1.5 rounded-lg border border-[#33456B] text-[#9FB0CA] text-sm font-semibold transition-colors hover:bg-green-400/5 peer-checked:text-green-400 peer-checked:border-green-400 peer-checked:bg-green-400/10 peer-focus-visible:ring-2 peer-focus-visible:ring-green-400/50">Retenu</span>
      </label>  
      <label class=" cursor-pointer">
        <input type="radio" name="statut" value="Entretien" class="peer sr-only">
        <span class="block text-center px-4 py-1.5 rounded-lg border border-[#33456B] text-[#9FB0CA] text-sm font-semibold transition-colors hover:bg-yellow-400/5 peer-checked:text-yellow-400 peer-checked:border-yellow-400 peer-checked:bg-yellow-400/10 peer-focus-visible:ring-2 peer-focus-visible:ring-yellow-400/50">Entretien</span>
      </label>    
    </div>
        <div class="flex flex-row-reverse justify-end gap-1">

          <input type="radio" name="rating" id="star5" value="5" class="peer sr-only">
          <label for="star5" class="cursor-pointer text-2xl text-gray-600 hover:text-yellow-400 peer-checked:text-yellow-400">★</label>

          <input type="radio" name="rating" id="star4" value="4" class="peer sr-only">
          <label for="star4" class="cursor-pointer text-2xl text-gray-600 hover:text-yellow-400 peer-checked:text-yellow-400">★</label>

          <input type="radio" name="rating" id="star3" value="3" class="peer sr-only">
          <label for="star3" class="cursor-pointer text-2xl text-gray-600 hover:text-yellow-400 peer-checked:text-yellow-400">★</label>

          <input type="radio" name="rating" id="star2" value="2" class="peer sr-only">
          <label for="star2" class="cursor-pointer text-2xl text-gray-600 hover:text-yellow-400 peer-checked:text-yellow-400">★</label>

          <input type="radio" name="rating" id="star1" value="1" class="peer sr-only">
          <label for="star1" class="cursor-pointer text-2xl text-gray-600 hover:text-yellow-400 peer-checked:text-yellow-400">★</label>

        </div>
    <div class="mb-5">

      <label for="coment" class="block text-sm font-semibold text-[#9FB0CA] mb-2">
        Commentaire :
      </label>

      <textarea
        id="coment"
        name="commentaire"
        rows="3"
        placeholder="Ajouter un commentaire sur le candidat..."
        class="w-full resize-none px-4 py-2 bg-[#0B1220] text-white text-sm rounded-lg border border-[#33456B] outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-400/30 placeholder:text-gray-500"
      ></textarea>

    </div>

    <button  class="full-wrap w-full">Enregistrer </button>
  </form>

</div>
<div class="sup fixed inset-0 z-[100]  items-center justify-center bg-black/60 p-4 "hidden >

    <form class=" flex flex-col items-center gap-5 w-full max-w-sm h-fit bg-[#0B1220] rounded-lg border border-[#33456B] p-6 shadow-2xl">

        <h2 class="text-center">
            Vous êtes sûr que vous voulez supprimer ce candidat ?
        </h2>

        <div class="flex justify-center items-center gap-3 w-full">
            <button type="button" class="ok flex-1 bg-red-500 text-lg rounded-lg border border-[#33456B] p-2">
                OUI
            </button>

            <button type="button" class="no flex-1 bg-zinc-400 text-lg rounded-lg border border-[#33456B] p-2">
                NON
            </button>
        </div>

    </form>

</div>


</body>
</html>
